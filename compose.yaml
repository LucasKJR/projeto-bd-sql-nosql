services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bd_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-lab-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d bd_lab"]
      interval: 5s
      retries: 20
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:57017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20
volumes:
  pgdata:
  mongodata:
